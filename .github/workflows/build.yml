name: Build Enoch (Chameleon)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13 (last Intel runner) is retired - the job sat queued
        # indefinitely and was never assigned a runner.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - name: Runner environment
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "--- Xcode versions present ---"
          ls /Applications | grep -i -E '^xcode' || echo "(none listed)"
          echo "--- active toolchain ---"
          xcodebuild -version || true
          clang --version

      # Chameleon is 32-bit Mach-O. Modern Xcode dropped i386 support, so
      # establish up front whether this runner can emit i386 at all.
      - name: Probe i386 support
        run: |
          echo 'int main(void){return 0;}' > /tmp/probe.c

          echo "=== compile-only (-arch i386 -c) ==="
          if clang -arch i386 -c /tmp/probe.c -o /tmp/probe.o 2>/tmp/cc.err; then
            echo "COMPILE_I386: OK"
            file /tmp/probe.o
          else
            echo "COMPILE_I386: FAIL"
            cat /tmp/cc.err
          fi

          echo "=== link (-arch i386) ==="
          if clang -arch i386 /tmp/probe.c -o /tmp/probe.bin 2>/tmp/ld.err; then
            echo "LINK_I386: OK"
            file /tmp/probe.bin
          else
            echo "LINK_I386: FAIL"
            cat /tmp/ld.err
          fi

          echo "=== freestanding link (closer to how a bootloader links) ==="
          if clang -arch i386 -nostdlib -Wl,-e,_main /tmp/probe.c -o /tmp/probe.free 2>/tmp/free.err; then
            echo "FREESTANDING_I386: OK"
            file /tmp/probe.free
          else
            echo "FREESTANDING_I386: FAIL"
            cat /tmp/free.err
          fi

      - name: Install nasm
        run: |
          brew install nasm || true
          which nasm && nasm -v

      - name: Clone Enoch source
        run: |
          git clone --depth 1 https://github.com/andyvand/Enoch.git enoch
          cd enoch
          echo "HEAD: $(git rev-parse HEAD)"
          cat version 2>/dev/null || true
          cat revision 2>/dev/null || true

      # CRITICAL: upstream commits ~695 prebuilt binaries under sym/, including
      # boot, boot0, boot1h and boot.sys. If left in place they survive a failed
      # build and are indistinguishable from freshly compiled output - the first
      # run produced artifacts byte-identical to these committed files. Removing
      # them means anything present in sym/ afterwards was genuinely built here.
      - name: Remove upstream prebuilt binaries
        run: |
          cd enoch
          echo "=== committed binaries being removed ==="
          git ls-files sym/ | wc -l
          for f in sym/i386/boot0 sym/i386/boot1h sym/i386/boot; do
            [ -f "$f" ] && printf "%-20s %s\n" "$(basename $f)" "$(shasum -a 256 "$f" | cut -d' ' -f1)"
          done
          rm -rf sym obj
          test ! -e sym/i386/boot || { echo "sym/ not cleared"; exit 1; }
          echo "sym/ and obj/ cleared"

      # Symbols_LINKER_ONLY.dylib is dead output: written at boot2/Makefile:142
      # and referenced nowhere but clean-local (line 206). Modern ld64 refuses it
      # ("dylibs must link with libSystem.dylib for architecture i386"), which
      # aborts the boot target before machOconv runs. Prefix the recipe line with
      # '-' so make tolerates the failure of an artifact it discards.
      - name: Make dead Symbols_LINKER_ONLY link non-fatal
        run: |
          cd enoch/i386/boot2
          perl -pi -e 's/^\t\@\$\(LD\) -arch i386/\t-\@\$(LD) -arch i386/' Makefile
          sed -n '134p' Makefile | cat -et   # -A is GNU-only; BSD cat uses -e -t
          grep -q -- '-@$(LD) -arch i386' Makefile || { echo "PATCH DID NOT APPLY"; exit 1; }

      # NASM >= ~2.15 rejects movzx with an unsized memory operand; the
      # 2010-era assembler Chameleon targeted inferred it. Line 358 compares
      # the same field via `cmp al`, so it is a byte.
      - name: Patch boot1x.s for modern NASM
        run: |
          cd enoch
          f=i386/boot1/boot1x.s
          echo "--- before ---"
          sed -n '357p' "$f"
          sed -i '' 's/movzx ax, \[BPR gsIterator + DirIterator\.entry\]/movzx ax, byte [BPR gsIterator + DirIterator.entry]/' "$f"
          echo "--- after ---"
          sed -n '357p' "$f"
          grep -q 'movzx ax, byte \[BPR gsIterator' "$f" || { echo "PATCH DID NOT APPLY"; exit 1; }

      # A 2010 codebase under clang 17 trips warnings that did not exist then
      # (e.g. K&R definitions: "a function definition without a prototype is
      # deprecated ... not supported in C2x"). With -Werror those abort the
      # build. Genuine errors still fail; only warnings stop being fatal.
      # This surfaced only after removing the prebuilt sym/i386/cconfig.
      - name: Strip -Werror from build files
        run: |
          cd enoch
          echo "=== before ==="
          grep -rn -- "-Werror" Make.rules i386/boot2/Makefile i386/modules/MakeInc.dir | wc -l
          find . \( -name Makefile -o -name Make.rules -o -name MakeInc.dir -o -name '*.mk' \) \
            -print0 | xargs -0 perl -pi -e 's/\s-Werror\b//g'
          echo "=== after (build files only) ==="
          remaining=$(grep -rn -- "-Werror" Make.rules i386/boot2/Makefile i386/modules/MakeInc.dir | wc -l)
          echo "$remaining"
          [ "$remaining" -eq 0 ] || { echo "-Werror still present"; exit 1; }

      - name: Attempt build
        id: build
        continue-on-error: true
        run: |
          cd enoch
          # revision rule shells out to svnversion, which is absent here
          [ -s revision ] || echo "0" > revision
          set -o pipefail
          # -k: keep going after errors so one run surfaces every remaining
          # source-compat break rather than just the first.
          make -k 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Distinct errors
        if: always()
        run: |
          echo "=== all error lines ==="
          grep -nE "error:|Error [0-9]" /tmp/build.log | head -60 || echo "(none)"

      - name: Build result summary
        if: always()
        run: |
          cd enoch || exit 0
          echo "=== outcome: ${{ steps.build.outcome }} ==="
          echo "=== produced binaries (sym/) ==="
          find sym -type f 2>/dev/null | head -50 || echo "(no sym/ output)"
          echo "=== boot stages (provenance-checked) ==="
          # sym/ was wiped before the build, so anything here was built now.
          # Compare against the upstream committed blob as a second check:
          # BUILT means our output differs from what upstream shipped.
          for f in sym/i386/boot0 sym/i386/boot1h sym/i386/boot; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              file "$f"
              ours=$(shasum -a 256 "$f" | cut -d' ' -f1)
              theirs=$(git show "HEAD:$f" 2>/dev/null | shasum -a 256 | cut -d' ' -f1)
              echo "  ours:     $ours"
              echo "  upstream: $theirs"
              if [ "$ours" = "$theirs" ]; then
                echo "  VERDICT: IDENTICAL TO UPSTREAM PREBUILT - treat as unverified"
              else
                echo "  VERDICT: BUILT FROM SOURCE"
              fi
            else
              echo "MISSING: $f"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.os }}
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Upload boot binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enoch-${{ matrix.os }}
          path: |
            enoch/sym/i386/boot0
            enoch/sym/i386/boot0md
            enoch/sym/i386/boot1h
            enoch/sym/i386/boot1f32
            enoch/sym/i386/boot
          if-no-files-found: warn
